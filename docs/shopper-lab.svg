<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" class="svg" viewBox="0 0 1120 350" role="img" aria-label="Shopper Lab swimlane. persona_gen makes one Tinfoil call for 20 personas. Lessons are read once from Cognee lab_outcomes. The shopper panel makes 20 Tinfoil calls, at most 8 at once. lab_analyst computes scores in pandas and makes one Tinfoil call. Results are written to Cognee in one batch, and the next run reads those lessons.">
<style>
  .svg { --bg:#ffffff; --surface:#ffffff; --ink:#15202b; --muted:#5a6774; --line:#cfd6de; --tf:#0a7671; --tf-soft:#e1f3f1;
    --tf-wash:#eef7f6; --cg:#6646c2; --cg-soft:#eee8fb; --sie:#a2650c; --retired:#8a939c; }
  @media (prefers-color-scheme: dark) {
    .svg { --bg:#0d1117; --surface:#151c23; --ink:#e5eaef; --muted:#95a2ae; --line:#2b3640; --tf:#41c6bc; --tf-soft:#11302e;
      --tf-wash:#0f1d1d; --cg:#a88ff2; --cg-soft:#221b38; --sie:#e2a74c; --retired:#6c7681; }
  }
  .svg .bgfill { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
  .svg text { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; fill: var(--ink); }
  .svg .b { font-weight: 600; font-size: 13px; }
  .svg .s { font-size: 11px; fill: var(--muted); }
  .svg .m { font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; }
  .svg .cap { font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em; }
  .svg .tf-t { fill: var(--tf); } .svg .cg-t { fill: var(--cg); } .svg .sie-t { fill: var(--sie); } .svg .ret-t { fill: var(--retired); }
  .svg .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
  .svg .stub { stroke-dasharray: 5 4; }
  .svg .tf-box { fill: var(--tf-soft); stroke: var(--tf); stroke-width: 1.6; }
  .svg .cg-box { fill: var(--cg-soft); stroke: var(--cg); stroke-width: 1.6; }
  .svg .sie-box { fill: var(--surface); stroke: var(--sie); stroke-width: 1.4; stroke-dasharray: 5 4; }
  .svg .ret-box { fill: var(--bg); stroke: var(--retired); stroke-width: 1.4; stroke-dasharray: 3 4; }
  .svg .enclave { fill: var(--tf-wash); stroke: var(--tf); stroke-width: 1.6; stroke-dasharray: 9 6; }
  .svg .chip { fill: var(--surface); stroke: var(--cg); stroke-width: 1; }
  .svg .w { fill: none; stroke: var(--ink); stroke-width: 1.4; }
  .svg .w-tf { stroke: var(--tf); stroke-width: 2.2; }
  .svg .w-cg { stroke: var(--cg); stroke-width: 2.2; }
  .svg .w-dash { stroke: var(--muted); stroke-dasharray: 5 4; }
  .svg .w-ret { stroke: var(--retired); stroke-dasharray: 3 4; }
  .svg .lane { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 5; }
  .svg .m-ink { fill: var(--ink); } .svg .m-tf { fill: var(--tf); } .svg .m-cg { fill: var(--cg); } .svg .m-mu { fill: var(--muted); }
</style>
<rect x="0.5" y="0.5" width="1119" height="349" rx="12" class="bgfill"/>
          <defs>
            <marker id="c-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ink"/></marker>
            <marker id="c-tf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-tf"/></marker>
            <marker id="c-cg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-cg"/></marker>
          </defs>
          <text x="20" y="81" class="cap s">PIPELINE</text>
          <text x="20" y="180" class="cap tf-t">TINFOIL</text>
          <text x="20" y="280" class="cap cg-t">COGNEE</text>
          <line x1="20" y1="132" x2="1100" y2="132" class="lane"/>
          <line x1="20" y1="230" x2="1100" y2="230" class="lane"/>

          <!-- Pipeline -->
          <rect x="150" y="40" width="175" height="74" rx="8" class="box"/>
          <text x="164" y="64" class="b">persona_gen</text><text x="164" y="84" class="s">4 per segment × 5</text><text x="164" y="102" class="m tf-t">~20 s</text>
          <rect x="345" y="40" width="175" height="74" rx="8" class="box"/>
          <text x="359" y="64" class="b">lessons</text><text x="359" y="84" class="s">read once, top 5</text><text x="359" y="102" class="m s">+ persona history</text>
          <rect x="540" y="40" width="175" height="74" rx="8" class="box"/>
          <text x="554" y="64" class="b">shopper panel</text><text x="554" y="84" class="s">photos shuffled A to D</text><text x="554" y="102" class="m tf-t">~25-33 s</text>
          <rect x="735" y="40" width="175" height="74" rx="8" class="box"/>
          <text x="749" y="64" class="b">lab_analyst</text><text x="749" y="84" class="s">pandas + 1000× bootstrap</text><text x="749" y="102" class="m tf-t">~5 s</text>
          <rect x="930" y="40" width="175" height="74" rx="8" class="box"/>
          <text x="944" y="64" class="b">remember</text><text x="944" y="84" class="s">one Cognee batch</text><text x="944" y="102" class="m cg-t">27 records · ~3 s</text>
          <line x1="325" y1="77" x2="345" y2="77" class="w" marker-end="url(#c-ink)"/>
          <line x1="520" y1="77" x2="540" y2="77" class="w" marker-end="url(#c-ink)"/>
          <line x1="715" y1="77" x2="735" y2="77" class="w" marker-end="url(#c-ink)"/>
          <line x1="910" y1="77" x2="930" y2="77" class="w" marker-end="url(#c-ink)"/>

          <!-- Tinfoil lane -->
          <rect x="150" y="154" width="175" height="54" rx="8" class="tf-box"/>
          <text x="164" y="176" class="s">1 call, strict JSON</text><text x="164" y="194" class="s">aggregates in, no PII</text>
          <rect x="540" y="154" width="175" height="54" rx="8" class="tf-box"/>
          <text x="554" y="176" class="s">20 calls, 8 at a time</text><text x="554" y="194" class="s">reasoning effort low</text>
          <rect x="735" y="154" width="175" height="54" rx="8" class="tf-box"/>
          <text x="749" y="176" class="s">1 call: 3 working,</text><text x="749" y="194" class="s">3 fix, 1-3 lessons</text>
          <line x1="237" y1="114" x2="237" y2="154" class="w w-tf" marker-end="url(#c-tf)"/>
          <line x1="627" y1="114" x2="627" y2="154" class="w w-tf" marker-end="url(#c-tf)"/>
          <line x1="822" y1="114" x2="822" y2="154" class="w w-tf" marker-end="url(#c-tf)"/>

          <!-- Cognee lane -->
          <rect x="345" y="254" width="175" height="50" rx="8" class="cg-box"/>
          <text x="359" y="276" class="m">lab_outcomes</text><text x="359" y="294" class="s">read by shopper</text>
          <rect x="930" y="254" width="175" height="50" rx="8" class="cg-box"/>
          <text x="944" y="276" class="m">lab_outcomes</text><text x="944" y="294" class="m">calibration · persona:*</text>
          <line x1="432" y1="254" x2="432" y2="114" class="w w-cg" marker-end="url(#c-cg)"/>
          <line x1="1017" y1="114" x2="1017" y2="254" class="w w-cg" marker-end="url(#c-cg)"/>
          <path d="M1017,304 V330 H432 V304" class="w w-cg" marker-end="url(#c-cg)"/>
          <text x="724" y="324" text-anchor="middle" class="s cg-t">next run reads these, plus lessons from record_observed(real sales)</text>
        </svg>
