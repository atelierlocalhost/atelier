<!doctype html>
<!--
  Jinja2 template for one social carousel slide. Context:
    headline : str
    body     : str
    index    : int (1-based slide number)
    total    : int (slides in the carousel)
  Fixed 1080x1350 (4:5) so it can be screenshotted to PNG.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social Card</title>
<style>
  html, body { margin:0; }
  .card { width:1080px; height:1350px; background:#3c204f; color:#ebf2ca; font-family:Georgia,'Times New Roman',serif;
          display:flex; flex-direction:column; justify-content:center; padding:96px; box-sizing:border-box; position:relative; }
  .brand { position:absolute; top:72px; left:96px; font-size:36px; letter-spacing:.12em; text-transform:uppercase; opacity:.8; }
  .n { position:absolute; top:72px; right:96px; font-size:36px; opacity:.7; }
  h1 { font-size:116px; line-height:1.05; margin:0 0 48px; }
  p { font-size:56px; line-height:1.3; margin:0; opacity:.92; }
  .rule { width:120px; height:6px; background:#ebf2ca; margin-bottom:48px; opacity:.6; }
</style>
</head>
<body>
<div class="card">
  <span class="brand">Atelier</span>
  <span class="n">{{ index }}/{{ total }}</span>
  <div class="rule"></div>
  <h1>{{ headline }}</h1>
  <p>{{ body }}</p>
</div>
</body>
</html>
